name: Update CANARD data

on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-canard-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch CANARD data
        run: node scripts/fetch-canard.mjs --item-retries 2

      - name: Commit updated data
        run: |
          if [[ -z "$(git status --porcelain -- canard.json)" ]]; then
            echo "CANARD data did not change"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canard.json
          git commit -m "Update CANARD data"
          git push origin HEAD:master
